[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-clipper"
version = "0.1.0"
description = "Clipping engine: paste a YouTube link, get short vertical clips with captions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.1.1",  # [default] includes the JS challenge solver (yt-dlp-ejs)
]

[project.optional-dependencies]
ai = ["anthropic>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
whisper = ["faster-whisper>=1.0"]
telegram = ["python-telegram-bot>=21"]
all = ["anthropic>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "faster-whisper>=1.0", "python-telegram-bot>=21"]
dev = ["pytest>=8"]

[project.scripts]
yt-clipper = "yt_clipper.cli:main"

[tool.setuptools.packages.find]
include = ["yt_clipper*"]

[tool.setuptools.package-data]
yt_clipper = ["static/*"]
