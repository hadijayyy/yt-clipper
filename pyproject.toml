[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-clipper"
version = "0.1.0"
description = "Clipping engine: paste a YouTube link, get short vertical clips with captions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
ai = ["anthropic>=2.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
whisper = ["faster-whisper>=1.0"]
all = ["anthropic>=2.0", "fastapi>=0.110", "uvicorn>=0.29", "faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
yt-clipper = "yt_clipper.cli:main"

[tool.setuptools.packages.find]
include = ["yt_clipper*"]

[tool.setuptools.package-data]
yt_clipper = ["static/*"]
